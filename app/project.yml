# Brev — XcodeGen project spec (XcodeGen 2.40+ syntax).
#
# Generates app/Brev.xcodeproj (gitignored). Normally driven by scripts/build.sh;
# by hand: `cd app && xcodegen generate` (after scripts/gen-bindings.sh, because
# Generated/BrevCore.swift must exist).
#
# Every hardening choice below names the CLAUDE.md section it serves.
# Phase 0 shape (docs/DECISIONS.md D-0003, D-0004): one AppKit target,
# UniFFI bindings compiled inline via a bridging header, Rust staticlib linked
# by path from core/target/release, host arch only.

name: Brev

options:
  # Fail fast on older XcodeGen releases whose spec keys differ.
  minimumXcodeGenVersion: "2.40.0"
  # Only used when PRODUCT_BUNDLE_IDENTIFIER is unset; the target sets it
  # explicitly to no.brev.app below (prefix + target name would give no.brev.Brev).
  bundleIdPrefix: no.brev
  # macOS 14.0 (CLAUDE.md §3.2, D-0006). Quoted so YAML keeps it a string.
  deploymentTarget:
    macOS: "14.0"
  # The oldest Xcode that builds Brev: the app uses symbols of the macOS 15.2
  # SDK. XcodeGen only writes it as LastUpgradeCheck; nothing enforces it.
  # README.md and scripts/build.sh name the same version (test.sh checks).
  xcodeVersion: "16.2"
  # UI is Norwegian bokmål only (CLAUDE.md §3.2); nb.lproj is the sole localisation.
  developmentLanguage: nb
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Debug and Release as before, plus Verify (docs/PHASE2_DESIGN.md §4.1): a
# Release build that also scans its own memory at each lock
# (Sources/Verify/SelfScan.swift, Tests/scan.c) for docs/VERIFY.md V39.
# scripts/build.sh never builds Verify; tools/verify/build.sh does.
configs:
  Debug: debug
  Release: release
  Verify: release

targets:
  Brev:
    type: application
    platform: macOS

    sources:
      # All app code. Contains Brev-Bridging-Header.h and nb.lproj/Localizable.strings
      # (XcodeGen turns the .lproj into a variant group in the Resources phase).
      - path: Sources
      # The UniFFI-generated Swift, as a single file on purpose. Listing only the
      # .swift keeps BrevCoreFFI.h and BrevCoreFFI.modulemap out of the Xcode
      # project, so the build cannot start depending on them by accident (a
      # future headers phase, an implicit module) and the compiled-inline path
      # (bridging header, D-0003) stays explicit. Not because of the bundle:
      # XcodeGen gives a .modulemap no build phase at all in an application
      # target (only static-library targets get a copy-files phase for it) and
      # puts a .h in the headers phase, which only frameworks and dynamic
      # libraries emit, so neither file would be copied into Brev.app either
      # way. The header is reached via HEADER_SEARCH_PATHS.
      - path: Generated/BrevCore.swift
      # The heap scanner of the CLI harness, for the Verify configuration's
      # self-scan. EXCLUDED_SOURCE_FILE_NAMES keeps it (and SelfScan.swift)
      # out of Debug and Release.
      - path: Tests/scan.c

    # Info.plist is generated by XcodeGen from this block (no hand-written plist).
    # CLAUDE.md §1.4 / §3.2 — it MUST NOT contain: NSAppleScriptEnabled, NSServices,
    # CFBundleDocumentTypes, CFBundleURLTypes, UTExportedTypeDeclarations,
    # NSUserActivityTypes, NSAppleEventsUsageDescription, or any Intents /
    # App Shortcuts keys. No NSMainNibFile either: the menu is built in code.
    info:
      path: Info.plist
      properties:
        # From the build, so the Dock and the Touch ID dialogs say «Brev B»
        # for the second instance (docs/PHASE3_DESIGN.md §7). "Brev" for Brev.
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: nb
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.social-networking
        # The NSApplication subclass that drops synthetic input (§2, §3.2).
        NSPrincipalClass: BrevApplication
        # LaunchServices starts Brev with this environment. libmalloc then
        # fills every freed block with 0x55, which removes the copies Apple
        # frameworks leave in freed memory (§2; docs/PHASE2_DESIGN.md §6.4).
        # LaunchGuard refuses to unlock without it.
        LSEnvironment:
          MallocScribble: "1"
        # The relay (docs/PHASE3_DESIGN.md §5.1): the build setting
        # BREV_RELAY_URL below. Rust accepts only http://127.0.0.1:<port>.
        # No NSAppTransportSecurity key: ATS governs URLSession, which Brev
        # never uses (reqwest opens BSD sockets; §5.5).
        BrevRelayURL: $(BREV_RELAY_URL)
        NSHumanReadableCopyright: "© 2026 Brev. Alle rettigheter forbeholdt."
        NSHighResolutionCapable: true

    # Entitlements are generated from this block into Brev.entitlements and wired
    # into CODE_SIGN_ENTITLEMENTS. App Sandbox ON (CLAUDE.md §3.2). The one
    # keychain access group holds the two Secure Enclave keys and the wrapped
    # DEK (§3.2, §3.3; docs/DECISIONS.md D-0035); it follows the bundle id
    # (AV26DNQ5SC.no.brev.app for Brev, AV26DNQ5SC.no.brev.app.b for Brev B;
    # docs/PHASE3_DESIGN.md §7), as KeyStore.accessGroup does. The
    # provisioning profile authorises it, and Xcode adds
    # application-identifier and team-identifier from the profile.
    # network.client lets Brev reach the relay on 127.0.0.1 (a sandboxed app
    # cannot connect without it; PHASE3 §0, §5.5); never network.server.
    # Never add cs.disable-library-validation, cs.allow-jit,
    # cs.allow-unsigned-executable-memory, cs.allow-dyld-environment-variables,
    # cs.debugger, get-task-allow, iCloud (keychain sharing with iCloud
    # included), another keychain group or temporary-exception entitlements
    # (§1.9, §3.2).
    entitlements:
      path: Brev.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)

    # Before anything is compiled, in every configuration: the Rust archive
    # this target links must not be a test archive. brev-mail's feature
    # allow-software-keys lets a letter go out in environment class C
    # (software keys, no Touch ID; docs/VAULT_SPLIT_PLAN.md §6) and compiles a
    # marker into the archive, which fails the build here. That covers
    # Release and Archive from the IDE and the Verify build of
    # tools/verify/build.sh; scripts/gen-bindings.sh checks the same after its
    # build. The app never links the test archive (core/target/test-archive).
    preBuildScripts:
      - name: Rust archive has no test features
        shell: /bin/sh
        inputFiles:
          - $(SRCROOT)/../core/target/release/libbrev_core.a
        outputFiles:
          - $(DERIVED_FILE_DIR)/rust-archive-checked
        script: |
          status=0
          /usr/bin/grep -aq BREV-ALLOW-SOFTWARE-KEYS "$SCRIPT_INPUT_FILE_0" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "error: $SCRIPT_INPUT_FILE_0 was built with allow-software-keys (a test archive); run scripts/gen-bindings.sh" >&2
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "error: $SCRIPT_INPUT_FILE_0 could not be read; run scripts/gen-bindings.sh" >&2
            exit 1
          fi
          /usr/bin/touch "$SCRIPT_OUTPUT_FILE_0"

    settings:
      base:
        # scripts/build.sh --instance b overrides both on the command line
        # (Brev B: "Brev B", no.brev.app.b; docs/PHASE3_DESIGN.md §7).
        PRODUCT_NAME: Brev
        PRODUCT_BUNDLE_IDENTIFIER: no.brev.app
        # The relay Brev talks to (Info.plist BrevRelayURL; PHASE3 §5.1).
        BREV_RELAY_URL: "http://127.0.0.1:8787"
        # Swift 5 language mode (D-0006). Quoted so YAML keeps "5.0" a string.
        SWIFT_VERSION: "5.0"
        # Optional-but-wanted strictness; "complete" is a later-phase item.
        SWIFT_STRICT_CONCURRENCY: minimal
        # Warnings-as-errors is a Phase 5 item (CLAUDE.md §5, Phase 5); off for now.
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

        # --- UniFFI "compiled inline" FFI wiring (CLAUDE.md §3.1) -----------------
        # The generated BrevCore.swift does `#if canImport(BrevCoreFFI)`; we do not
        # build a BrevCoreFFI Clang module, so that is false and the C declarations
        # come from the bridging header instead. Paths are $(SRCROOT)-relative
        # (SRCROOT = app/), so a clean checkout builds without absolute paths.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Brev-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Generated
        # Links the Rust core (all storage/crypto lives there, §3.1) as a
        # staticlib, built by scripts/gen-bindings.sh (cargo --release, host arch).
        # The archive is named BY PATH on purpose (D-0003): core/target/release
        # also holds libbrev_core.dylib (the cdylib bindgen reads), and ld64 /
        # ld-prime resolve `-lbrev_core` to the .dylib before the .a
        # (-search_paths_first is the default). That would bind Brev to a file
        # outside the bundle. Do NOT reintroduce -lbrev_core or add
        # core/target/release to LIBRARY_SEARCH_PATHS. No other -l flags are
        # needed: Rust std and libc on Apple only pull in libSystem re-exports
        # that Xcode's link driver adds anyway.
        # Verify on a Mac: `otool -L Brev.app/Contents/MacOS/Brev` shows no
        # libbrev_core.dylib.
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/../core/target/release/libbrev_core.a

        # --- Bundle hardening (CLAUDE.md §3.2, §2 threat model) ------------------
        # Hardened Runtime ON: implies library validation, no DYLD env injection,
        # no unsigned executable memory — no other process can load code into Brev
        # (§2: AI agents / automation on the same Mac).
        ENABLE_HARDENED_RUNTIME: "YES"
        # App Sandbox ON (§3.2). Redundant with the entitlements file, and harmless.
        ENABLE_APP_SANDBOX: "YES"
        CODE_SIGN_ENTITLEMENTS: Brev.entitlements
        # Signed by the owner's team with a Mac App Development profile
        # (docs/DECISIONS.md D-0035, replacing D-0005's ad-hoc signing): the
        # data protection keychain binds Brev's keys to this signing identity,
        # and an ad-hoc build cannot reach them (-34018). Automatic signing
        # picks the Apple Development certificate and the profile; xcodebuild
        # needs -allowProvisioningUpdates (scripts/build.sh and test.sh pass
        # it). Developer ID signing and notarization are Phase 5.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AV26DNQ5SC
        # Build-phase scripts (the archive check above) run sandboxed, so a
        # script phase cannot silently read or write outside its declared
        # inputs and outputs (§1.1 hygiene).
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        # Smaller binary, less to audit (§5 Phase 5 reproducibility).
        DEAD_CODE_STRIPPING: "YES"

      configs:
        Debug:
          # The Rust core is built for the host arch only in Phase 0 (no --target),
          # so Xcode must not try to link an x86_64+arm64 universal binary.
          # Universal/lipo builds are a Phase 5 item.
          ONLY_ACTIVE_ARCH: "YES"
          # The self-scan exists only in the Verify configuration.
          EXCLUDED_SOURCE_FILE_NAMES: SelfScan.swift scan.c
          # Debug deliberately keeps Xcode's default CODE_SIGN_INJECT_BASE_ENTITLEMENTS
          # (YES): that injects com.apple.security.get-task-allow so lldb can attach
          # while developing. This entitlement must NEVER reach a shipped build —
          # see the Release config. (CLAUDE.md §3.2: get-task-allow OFF.)
        Release:
          ONLY_ACTIVE_ARCH: "YES"
          # Keeps get-task-allow (and any other Xcode-injected base entitlement)
          # OUT of the Release bundle, so no debugger or agent can attach to the
          # running app and read plaintext from memory (CLAUDE.md §3.2, §1.1, §2).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
          # Strip symbols from the installed/archived product: fewer hints for
          # reverse-engineering the content path. Takes effect on install/archive
          # builds (DEPLOYMENT_POSTPROCESSING), which is where shipped bits come from.
          STRIP_INSTALLED_PRODUCT: "YES"
          # The self-scan exists only in the Verify configuration.
          EXCLUDED_SOURCE_FILE_NAMES: SelfScan.swift scan.c
        Verify:
          # Release, as above, so the self-scan measures a process that is
          # signed and configured like the shipped one (docs/VERIFY.md V1, V2).
          ONLY_ACTIVE_ARCH: "YES"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
          STRIP_INSTALLED_PRODUCT: "YES"
          # Plus the self-scan: SelfScan.swift and scan.c are compiled, and
          # LockController calls SelfScan under this condition.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: BREV_SELFSCAN
          # The app's bridging header plus scan.h, found in Tests/.
          SWIFT_OBJC_BRIDGING_HEADER: Sources/Verify/Brev-Verify-Bridging-Header.h
          HEADER_SEARCH_PATHS:
            - $(inherited)
            - $(SRCROOT)/Generated
            - $(SRCROOT)/Tests

schemes:
  Brev:
    build:
      targets:
        Brev: all
    run:
      config: Debug
    # No test bundle in Phase 0 (Rust tests live in core/, run by scripts/test.sh);
    # the action exists so `xcodebuild -scheme Brev test` is well-defined.
    test:
      config: Debug
    # profile/analyze/archive use XcodeGen defaults (Release/Debug/Release).

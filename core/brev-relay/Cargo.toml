[package]
name = "brev-relay"
description = "Brev relay server: stores ciphertext envelopes and routing metadata only (Phase 3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library, so brev-mail's end-to-end tests can run the relay in-process,
# and a thin binary (serve, release) around it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "brev-relay"
path = "src/main.rs"

[dependencies]
brev-proto = { path = "../brev-proto" }
axum = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test signers (tests/ only; production code never builds a signing key).
p256 = { workspace = true }
# The same HTTP client brev-mail uses, so the tests speak to the relay over
# real HTTP on 127.0.0.1.
reqwest = { workspace = true }
# Seals a test payload the way brev-mail does, for the no-plaintext test.
chacha20poly1305 = { workspace = true }

[lints]
workspace = true

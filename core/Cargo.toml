[workspace]
resolver = "2"
members = [
    "brev-core",
    "brev-proto",
    "brev-relay",
    "uniffi-bindgen",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# Only dependencies from CLAUDE.md §4 may appear here.
# Adding anything else requires asking first.
[workspace.dependencies]
uniffi = { version = "0.32", default-features = false }
thiserror = "2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# Direct dependency only to turn on `zeroize`: chacha20poly1305's own
# `zeroize` feature does not reach poly1305, whose Drop then leaves the
# one-time MAC key in memory (CLAUDE.md §1.10). Never imported in code.
poly1305 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
hkdf = "0.13.0"
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
zeroize = "1.9.0"
# brev-core's global allocator: zeroes every freed heap block, including the
# RustBuffers Swift frees through UniFFI (docs/DECISIONS.md D-0032 item 4).
zeroizing-alloc = "0.1.1"
ed25519-dalek = "3.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The release profile is deliberately cargo's default in Phase 0
# (docs/DECISIONS.md D-0001): `strip` would remove the symbol table that
# uniffi-bindgen reads from the cdylib, and `lto` is silently ignored for a
# crate that also builds an rlib. Symbol stripping, LTO and universal builds
# are Phase 5 items alongside the reproducible build. Panics keep unwinding
# (the default) so `Drop`-based zeroization runs on the way out.
[profile.release]

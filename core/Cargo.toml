[workspace]
resolver = "2"
members = [
    "brev-core",
    "brev-proto",
    "brev-relay",
    "uniffi-bindgen",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# Only dependencies from CLAUDE.md §4 may appear here.
# Adding anything else requires asking first.
[workspace.dependencies]
uniffi = { version = "0.32", default-features = false }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The release profile is deliberately cargo's default in Phase 0
# (docs/DECISIONS.md D-0001): `strip` would remove the symbol table that
# uniffi-bindgen reads from the cdylib, and `lto` is silently ignored for a
# crate that also builds an rlib. Symbol stripping, LTO and universal builds
# are Phase 5 items alongside the reproducible build. Panics keep unwinding
# (the default) so `Drop`-based zeroization runs on the way out.
[profile.release]

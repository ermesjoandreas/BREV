[package]
name = "brev-core"
description = "Brev core: storage, crypto and session state, exposed to Swift via UniFFI"
version.workspace = true
edition.workspace = true
# Not the workspace's 1.85: reqwest -> url -> idna -> idna_adapter 1.2.2 ->
# ICU4X 2.3 declares 1.88 (docs/PHASE3_DESIGN.md §0). brev-proto and
# brev-relay stay at 1.85.
rust-version = "1.88"
license.workspace = true
publish.workspace = true

[lib]
name = "brev_core"
# `lib` for Rust tests and the relay, `staticlib` for the macOS app,
# `cdylib` so `uniffi-bindgen --library` can read metadata on any host.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { workspace = true }
thiserror = { workspace = true }
brev-proto = { path = "../brev-proto" }
rusqlite = { workspace = true }
chacha20poly1305 = { workspace = true }
poly1305 = { workspace = true }  # only for its `zeroize` feature (see core/Cargo.toml)
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
zeroizing-alloc = { workspace = true }
# The relay client (src/relay.rs): blocking, no TLS, no proxy, no JSON.
reqwest = { workspace = true }

[dev-dependencies]
# Test signers for the identity key (src/test_keys.rs and tests/ only;
# production code never builds a signing key).
p256 = { workspace = true }
# The relay in-process on 127.0.0.1:0 for the network tests.
brev-relay = { path = "../brev-relay" }
# `trace` (a no-dependency feature of an approved crate) lets one test record
# every SQL statement with its bound values. Test builds only.
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true

[package]
name = "brev-mail"
description = "Brev mail: identity, contacts, letters and the relay client on top of brev-vault, exposed to Swift via UniFFI"
version.workspace = true
edition.workspace = true
# The workspace's 1.89 (brev-vault's File::try_lock); reqwest -> url -> idna
# -> idna_adapter 1.2.2 -> ICU4X 2.3 alone needs 1.88 (docs/PHASE3_DESIGN.md
# §0).
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Kept from brev-core: the UniFFI checksums, the `uniffi_brev_core_*`
# symbols, libbrev_core.a and the generated Swift all carry this name
# (docs/VAULT_SPLIT_PLAN.md §2).
name = "brev_core"
# `lib` for Rust tests and the relay, `staticlib` for the macOS app,
# `cdylib` so `uniffi-bindgen --library` can read metadata on any host.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { workspace = true }
thiserror = { workspace = true }
brev-proto = { path = "../brev-proto" }
# The store, its DEK, column encryption, padding and the zeroing allocator.
brev-vault = { path = "../brev-vault", default-features = false, features = ["zeroing-allocator"] }
# Hand (docs/AUTHORSHIP.md): the facts of a letter, its class, the token the
# identity key signs, and the recipient's checks.
brev-hand = { path = "../brev-hand" }
rusqlite = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
# The relay client (src/relay.rs): blocking, no TLS, no proxy, no JSON.
reqwest = { workspace = true }

[features]
# The app's archive refuses an unsafe process (brev-vault's launch guard).
# The tests run with --no-default-features, which turns it off.
default = ["launch-guard"]
launch-guard = ["brev-vault/launch-guard"]
# `MockTransport` and the vault's test counters and accessors, for the tests
# (docs/VAULT_SPLIT_PLAN.md Q5). Never in the app's archive: gen-bindings.sh
# builds with the default features.
test-hooks = ["brev-vault/test-hooks"]
# Sending in environment class C (software keys, no Touch ID), for the test
# archive that the Swift harness, the lock probe and the view host link
# (docs/VAULT_SPLIT_PLAN.md §6). Never in the app's archive:
# scripts/gen-bindings.sh and the build phase in app/project.yml fail on its
# marker.
allow-software-keys = []

[dev-dependencies]
# Turns on `test-hooks` for this crate's own tests, the integration tests in
# tests/ included.
brev-mail = { path = ".", default-features = false, features = ["test-hooks"] }
# Test signers for the identity key (src/test_keys.rs and tests/ only;
# production code never builds a signing key).
p256 = { workspace = true }
# The random bytes of tests/common.
rand = { workspace = true }
# The relay in-process on 127.0.0.1:0 for the network tests.
brev-relay = { path = "../brev-relay" }
# `trace` (a no-dependency feature of an approved crate) lets one test record
# every SQL statement with its bound values. Test builds only.
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true

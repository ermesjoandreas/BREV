[package]
name = "brev-proto"
description = "Brev wire format and envelope, shared between brev-core and brev-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
p256 = { workspace = true }
sha2 = { workspace = true }
# The padding lives in the vault and is re-exported here. No allocator: the
# relay gets none through this line (docs/VAULT_SPLIT_PLAN.md §4).
brev-vault = { path = "../brev-vault", default-features = false }

[lints]
workspace = true

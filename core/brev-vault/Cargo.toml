[package]
name = "brev-vault"
description = "Brev vault: the encrypted SQLite store, its DEK and lock state, column encryption, padding and memory wiping; no UniFFI, no network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# An rlib only: brev-mail builds the app's archive and its bindings.
[lib]
crate-type = ["lib"]

# Only these, and scripts/check-vault-deps.sh fails on any other
# (docs/VAULT_SPLIT_PLAN.md §4): no network, no UniFFI, no hashing.
[dependencies]
thiserror = { workspace = true }
rusqlite = { workspace = true }
chacha20poly1305 = { workspace = true }
poly1305 = { workspace = true }  # only for its `zeroize` feature (see core/Cargo.toml)
rand = { workspace = true }
zeroize = { workspace = true }
zeroizing-alloc = { workspace = true, optional = true }

[features]
default = ["zeroing-allocator", "launch-guard"]
# The global allocator that zeroes every freed heap block (src/lib.rs).
# brev-mail turns it on; brev-proto, and so the relay, leave it off.
zeroing-allocator = ["dep:zeroizing-alloc"]
# Refuse to create, open or unlock a store in a process with a DYLD_*
# variable or without MallocScribble=1 (src/launch.rs). In the app's archive
# (brev-mail's default); off in the tests, which run with
# --no-default-features (docs/VAULT_SPLIT_PLAN.md §4, §5c).
launch-guard = []
# Test counters and accessors for the tests of the crates built on the
# vault. Never in the app's archive.
test-hooks = []

[lints]
workspace = true
